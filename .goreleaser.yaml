# GoReleaser builds, archives and publishes the release artifacts.
# Validate changes with `goreleaser check`, and dry-run the whole release
# with `goreleaser release --snapshot --clean` BEFORE pushing a tag.
version: 2

project_name: devtools

before:
  hooks:
    # Deliberately `download` and not `go mod tidy`: a tidy that rewrites
    # go.sum leaves the tree dirty, which GoReleaser refuses to release from.
    - go mod download

# Split by OS purely so binary_signs can target the darwin artifacts; the
# build settings are otherwise identical.
builds:
  - id: darwin
    main: .
    binary: devtools
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # Must match the Makefile's stamp target, or `devtools version` reports "dev".
      - -s -w -X github.com/neverprepared/devtools/internal/cli.version={{ .Version }}

  - id: linux
    main: .
    binary: devtools
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/neverprepared/devtools/internal/cli.version={{ .Version }}

# Codesign + notarize each darwin binary before it is archived. The signature
# is embedded in the Mach-O, so the tar.gz carries it. The script no-ops when
# MACOS_IDENTITY is unset, keeping `--snapshot` usable without credentials.
binary_signs:
  - id: macos
    ids:
      - darwin
    cmd: ./scripts/sign-and-notarize.sh
    args:
      - "${artifact}"
    artifacts: binary

archives:
  - id: devtools
    ids:
      - darwin
      - linux
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: neverprepared
    name: devtools
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    go install github.com/neverprepared/devtools@{{ .Tag }}
    ```

    Or download an archive below and put the binary on your `PATH`:

    ```sh
    tar xzf devtools_{{ .Version }}_darwin_arm64.tar.gz
    install -m 755 devtools ~/.local/bin/devtools
    ```

    Verify it against `checksums.txt`:

    ```sh
    shasum -a 256 -c checksums.txt --ignore-missing
    ```

    **Platform support.** `web check` and `cron` work anywhere. `teams`,
    `launchd`, and the keychain-reading side of `ca` require macOS and exit
    with a clear "requires macOS" error elsewhere.
